[package]
name = "pumpkin"
version.workspace = true
description = "The `pumpkin` command, which runs workflows"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pumpkin"
path = "src/main.rs"
test = false

[dependencies]
aws = { path = "../aws" }
docker = { path = "../../providers/docker" }
ec2 = { path = "../../providers/ec2" }
engine = { path = "../engine" }
gateway = { path = "../gateway" }
install = { path = "../install" }
lang = { path = "../lang" }
library = { path = "../library" }
modal = { path = "../../providers/modal" }
provider = { path = "../provider" }
recipe = { path = "../recipe" }
route = { path = "../route" }
runtime = { path = "../runtime" }
schema = { path = "../schema" }
stdx = { path = "../stdx" }
tls = { path = "../tls" }
clap.workspace = true
jiff.workspace = true
libc.workspace = true
miniz_oxide.workspace = true
rustix = { workspace = true, features = ["event", "fs", "process", "stdio", "thread"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
test-support = { path = "../test-support" }
expect-test.workspace = true

[lints]
workspace = true
