# `@USER@` admits only the members' keys, each with its forced command, from a file that root
# owns, which no job can append to as it could to `~@USER@/.ssh/authorized_keys`; a member who is
# root through `docker` can change it, and the timer copies the list back within a minute. EC2
# Instance Connect's command, which `ssh.service` gives on `sshd`'s command line, stays for the
# admin's `ubuntu` alone, as a `Match` block's value replaces it. Both keywords hold in `Match`,
# and a key that the file lacks makes `sshd` log that `none` is no absolute path:
# https://github.com/openssh/openssh-portable/blob/d76b2675116617394cd355a3437b4963a562b64d/sshd_config.5#L1276-L1292
# https://github.com/openssh/openssh-portable/blob/0ffb46f2ee2ffcc4daf45ee679e484da8fcf338c/servconf.c#L2530-L2540
Match User @USER@
    AuthorizedKeysFile @MEMBERS@
    AuthorizedKeysCommand none
