# So that a session whose client has gone without a close, as a machine that slept or lost its
# network, ends within minutes rather than when TCP gives up, and stops holding off the idle
# stop. `sshd` probes after each 30 s in which it has nothing else to do, and ends the session
# once 3 probes have gone unanswered: about 2 minutes. The first value read wins, so the name
# sorts before cloud-init's own file.
# https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L111-L141
# https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L240-L251
ClientAliveInterval 30
ClientAliveCountMax 3
# Simultaneous commands each open a session, as on SkyPilot's nodes.
MaxStartups 150:30:200
