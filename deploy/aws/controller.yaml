#cloud-config
# The controller's first boot, on Ubuntu 24.04 LTS: what its jobs need, at the versions
# controller.tf names, then the Pumpkin release that `pumpkin_release` pins, whose
# `pumpkin controller install` installs what Pumpkin itself relies on there: its user, its units
# and `sshd`'s settings. An admin upgrades them by running a later release's install.

# Over HTTPS, the one way out the controller's security group allows.
apt:
  primary:
    - arches: [default]
      uri: ${ubuntu_snapshot}
  security:
    - arches: [default]
      uri: ${ubuntu_snapshot}
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu noble stable"
      key: |
        ${indent(8, docker_key)}

package_update: true
packages:
  - [docker-ce, "${docker_version}"]
  - [docker-ce-cli, "${docker_version}"]
  - [containerd.io, "${containerd_version}"]
  - [docker-buildx-plugin, "${buildx_version}"]
  - unzip

write_files:
  # Builds find images by their manifests' digests, which only the containerd image store keeps.
  - path: /etc/docker/daemon.json
    content: |
      {"features": {"containerd-snapshotter": true}}

# cloud-init runs these as one script, which stops at the first failure. AWS CLI v2's archive,
# whose SHA-256 is that of the one AWS's signature verifies (key FB5D B77F D5C1 18B8 0511 ADA8
# A631 0ACC 4672 475C); then Pumpkin's, whose SHA-256 is the third word of the `.pumpkinversion`
# line, after the tag and the commit, and whose install arms the idle stop before the rest; then
# uv's, whose SHA-256 is the one its release publishes beside it.
runcmd:
  - |
    set -o errexit
    cd "$(mktemp --directory)"
    curl --fail --silent --show-error --location --proto '=https' --output awscli.zip \
        https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${aws_cli_version}.zip
    echo '${aws_cli_sha256}  awscli.zip' | sha256sum --check --strict
    unzip -q awscli.zip
    ./aws/install
    set -- ${pumpkin_release}
    curl --fail --silent --show-error --location --proto '=https' --output pumpkin.tar.xz \
        "https://github.com/FrontierCS/Pumpkin/releases/download/$1/pumpkin-$1-x86_64-unknown-linux-musl.tar.xz"
    echo "$3  pumpkin.tar.xz" | sha256sum --check --strict
    mkdir pumpkin
    tar --extract --xz --file=pumpkin.tar.xz --directory=pumpkin
    pumpkin/bin/pumpkin controller install
    curl --fail --silent --show-error --location --proto '=https' --output uv.tar.gz \
        https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-x86_64-unknown-linux-gnu.tar.gz
    echo '${uv_sha256}  uv.tar.gz' | sha256sum --check --strict
    tar --extract --gzip --file=uv.tar.gz
    install --mode=0755 uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
  - systemctl restart docker.service
